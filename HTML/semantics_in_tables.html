<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantics in HTML</title>
</head>
<body>
    <!-- <thead> to wrap table header
         <tbody  to wrap the table body
         <tfoot> to wrap table footer 
    -->
        
     <table border="black"> 
            <caption> Food Items </caption>
            <thead>
                <tr>
                    <th>Item</th>
                    <th>Price</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Red Bull</td>
                    <td>120</td>
                </tr>
                <tr>
                    <td>Footlong</td>
                    <td>140</td>
                </tr>
                <tr>
                    <td>Fries</td>
                    <td>30</td>
                </tr>
            </tbody>
    </table>
</body>
</html>
