<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <!-- Table is a combination of rows and column-->
    
    <!-- Below is the table with 4 rows (tr) and 2 columns (th)-->
    <table border="black"> 
        <caption> Food Items </caption>
        <tr>
            <th>Item</th>
            <th>Price</th>
        </tr>
        <tr>
            <td>Red Bull</td>
            <td>120</td>
        </tr>
        <tr>
            <td>Footlong</td>
            <td>140</td>
        </tr>
        <tr>
            <td>Fries</td>
            <td>30</td>
        </tr>
    </table>
</body>
</html>
