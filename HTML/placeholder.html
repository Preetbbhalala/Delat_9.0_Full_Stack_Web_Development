<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placeholder</title>
</head>
<body>
    <!-- Placeholder element helps user to know what each field does -->
    <!-- Labels elemnt represents a caption for an item in a user interface-->
     <form actions="./actions.php">
        <label>
            Enter your username:
            <input type="text" placeholder="Enter your name"> 
        </label>
        <br>
        <label>
            Enter your password: 
            <input type="password" placeholder="Enter password">
        </label>
    </form>

    <!-- Classical Approach using "for"-->
    <label for="dob">Enter your D.O.B: </label>
    <input type="date" id="dob" placeholder="Select your Birthdate">


</body>
</html>
