<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms in HTML</title>
</head>
<body>
    <!-- Action attribute is used to define what action needs to be performed when a form is submitted
         Or, where the form data should be sent
    -->
    
    <!-- Input element is used to create multiple form controls 
         There are multiple types of inputs that can be created using type attribute 
    -->

    <!-- Popular Type attributes:
          1. type="text"
          2. type="password"
          3. type="number"
          4. type="time"
          5. type="color"
    -->
    <form action="/actions.php">
        <p>Text: <input type="text"></p>
        <p>Password: <input type="password"></p>
        <p>Number: <input type="number"></p>
        <p>Time: <input type="time"></p>
        <p>Color: <input type="color"></p>
    </form>
</body>
</html>
