<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colspan & Rowspan</title>
</head>
<body>
    <!-- Colspan and Rowspan attributes is used to create cells which spans over multiple rows or columns-->
            
    <table border="black"> 
            <caption> Food Items </caption>
            <thead>
                <tr>
                    <th rowspan="2">Item</th>
                    <th colspan="2">Price</th>
                </tr>
                <tr>
                    <th>INR</th>
                    <th>USD</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Red Bull</td>
                    <td>120</td>
                    <td>0.14</td>
                </tr>
                <tr>
                    <td>Footlong</td>
                    <td>140</td>
                    <td>2.99</td>
                </tr>
                <tr>
                    <td>Fries</td>
                    <td>30</td>
                    <td>1.50</td>
                </tr>
            </tbody>
    </table>
</body>
</html>
